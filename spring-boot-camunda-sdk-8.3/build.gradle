
// Build.gradle generated for instrumentation module spring-boot-camunda-sdk-8.4

apply plugin: 'java'

dependencies {

   implementation 'io.camunda.spring:spring-client-zeebe:8.3.0'

   // New Relic Java Agent dependencies
   implementation 'com.newrelic.agent.java:newrelic-agent:' + project.findProperty('java.agent.version')
   implementation 'com.newrelic.agent.java:newrelic-api:' + project.findProperty('java.agent.version')
   implementation 'com.newrelic.agent.java:agent-bridge:' + project.findProperty('java.agent.version')
   implementation fileTree(include: ['*.jar'], dir: '../test-lib')
}

jar {
  manifest {
    attributes 'Implementation-Title': 'com.newrelic.instrumentation.labs.spring-boot-camunda-sdk-8.3'
    attributes 'Implementation-Vendor': 'New Relic Labs'
    attributes 'Implementation-Vendor-Id': 'com.newrelic.labs'
    attributes 'Implementation-Version': 1.0
  }
}

verifyInstrumentation {
	passesOnly 'io.camunda.spring:spring-client-zeebe:[8.3.0,)'
	exclude 'io.camunda.spring:spring-client-zeebe:[8.3.9,8.3.12)'
	exclude 'io.camunda.spring:spring-client-zeebe:[8.4.13,8.4.16)'
	exclude 'io.camunda.spring:spring-client-zeebe:[8.5.13,8.5.16)'
	excludeRegex('.*-RC.*')
	excludeRegex('.*-rc.*')
	excludeRegex('.*alpha.*')
	
}